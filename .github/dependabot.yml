# Atualizações de dependências agrupadas (mensal) — PRs passam pelo CI completo (check + e2e).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      next-react:
        patterns:
          - next
          - react
          - react-dom
          - eslint-config-next
          - "@types/react*"
      dev-tooling:
        dependency-type: development
        exclude-patterns:
          - eslint-config-next
          - "@types/react*"
      runtime:
        dependency-type: production
        exclude-patterns:
          - next
          - react
          - react-dom
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
